name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate seed graph against the model
        run: npm run validate
      - name: Tests (model, queries, embeddings, HTTP, MCP)
        run: npm test
